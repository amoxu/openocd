  build-sbc-aarch64:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build
    steps:
      - uses: actions/checkout@v2
      - name: install deps
        run: sudo apt update && sudo apt install -y git libtool pkg-config autoconf automake libudev-dev build-essential cmake gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: build
        env:
          MAKE_JOBS: 2
          CROSS_HOST: aarch64-linux-gnu
        run: |
          export PREFIX="$(realpath $BUILD_DIR)/opt"
          export BUILD_FOLD="$(realpath $BUILD_DIR)/libs"
          mkdir -p $PREFIX $BUILD_FOLD

          export CC=${CROSS_HOST}-gcc
          export CXX=${CROSS_HOST}-g++
          export AR=${CROSS_HOST}-ar
          export RANLIB=${CROSS_HOST}-ranlib
          export PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig

          #LIBUSB1
          export LIBUSB1_VER=1.0.26
          cd $BUILD_FOLD && git clone https://github.com/libusb/libusb && cd libusb && git checkout tags/v$LIBUSB1_VER -b v$LIBUSB1_VER && ./bootstrap.sh
          ./configure --host=$CROSS_HOST --prefix="$PREFIX" --disable-shared
          make install

          #HIDAPI
          export HIDAPI_VER=0.11.2
          cd $BUILD_FOLD && git clone https://github.com/libusb/hidapi && cd hidapi && git checkout tags/hidapi-$HIDAPI_VER -b $HIDAPI_VER && ./bootstrap
          ./configure --host=$CROSS_HOST --prefix="$PREFIX" --disable-shared --disable-testgui
          make install

          #LIBFTDI
          export LIBFTDI_VER=1.5
          cd $BUILD_FOLD && git clone git://developer.intra2net.com/libftdi && cd libftdi && git checkout tags/v$LIBFTDI_VER -b v$LIBFTDI_VER
          sed -i "24,39s/^/# /" ./src/CMakeLists.txt
          cmake -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DSTATICLIBS=ON -DEXAMPLES=OFF -DFTDI_EEPROM=OFF \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_C_COMPILER=${CC} -DCMAKE_CXX_COMPILER=${CXX} \
            -DPKG_CONFIG_EXECUTABLE=$(which pkg-config) \
            .
          make install

          #CAPSTONE
          export CAPSTONE_VER=4.0.2
          cd $BUILD_FOLD && git clone https://github.com/capstone-engine/capstone.git && cd capstone && git checkout tags/$CAPSTONE_VER -b $CAPSTONE_VER
          make install PREFIX="$PREFIX" CROSS="${CROSS_HOST}-" \
            CAPSTONE_BUILD_CORE_ONLY=yes CAPSTONE_STATIC=yes CAPSTONE_SHARED=no CAPSTONE_ARCHS="arm"

          cd $PREFIX/../..
          ./bootstrap
          ./configure --host=$CROSS_HOST --prefix="$PREFIX/openocd" --disable-werror --disable-doxygen-html --with-capstone
          make
          make install-strip

          echo "ARTIFACT_PATH=$PREFIX/openocd" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openocd-sbc-aarch64
          path: ${{ env.ARTIFACT_PATH }}/*

